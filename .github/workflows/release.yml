name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}

    steps:
      
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install semantic-release and plugins
        run: |
          npm install -g semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/exec
      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

      - name: Read released version
        id: version
        run: |
          tag="$(git tag --points-at HEAD --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+/ && !found { print; found=1 }')"
          if [[ -z "${tag}" ]]; then
            echo "No release tag was created for this commit; the image build will be skipped."
            exit 0
          fi
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  build-and-push:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      target_environment: production
      image_tags: ${{ needs.release.outputs.tag }},latest
      git_ref: ${{ needs.release.outputs.tag }}
      git_commit: ${{ needs.release.outputs.commit }}
