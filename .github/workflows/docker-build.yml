name: Build and Publish Podman Image

# This workflow is intentionally disabled. Keep image publication manual until
# automated GHCR publishing is explicitly approved.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Deployment environment used to select the image tag
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      image_tag:
        description: GHCR image tag to publish
        required: true
        type: string

jobs:
  test:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest --verbose

      - name: Run linter
        run: uv run ruff check src/ tests/

  build-and-push:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ghcr.io/humlab-sead/sead_authority_service
      TARGET_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || github.event.inputs.target_environment }}
      IMAGE_TAG: ${{ github.event_name == 'push' && 'latest' || github.event.inputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Podman
        run: podman --version

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build image with Podman
        run: |
          ./deployment/container/scripts/build.sh \
            --git-ref "$GITHUB_REF_NAME" \
            --git-commit "$GITHUB_SHA" \
            --target-env "$TARGET_ENVIRONMENT" \
            --tag "$IMAGE_TAG"

      - name: Push image with Podman
        id: push
        run: |
          image="$IMAGE_NAME:$IMAGE_TAG"
          podman push --digestfile "$RUNNER_TEMP/image.digest" "$image"
          digest="$(cat "$RUNNER_TEMP/image.digest")"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Report build details
        if: always()
        run: |
          {
            echo "### Podman image build"
            echo
            echo "- Environment: $TARGET_ENVIRONMENT"
            echo "- Image: $IMAGE_NAME:$IMAGE_TAG"
            echo "- Digest: ${{ steps.push.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
