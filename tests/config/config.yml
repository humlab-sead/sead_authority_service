  database:
    host: humle.dumle.japp.ouch
    dbname: smurfs
    user: holamundo
    port: 9999
    pool_min_size: 1
    pool_max_size: 5
    pool_timeout: 10.0
policy:
  site:
    proximity_boost:
      very_near_distance_km: 0.2
      to_far_distance_km: 10.0
    place_name_similarity_boost:
      similarity_threshold: 0.3
      max_boost: 0.1
  modification_type:
    lookup_format: "json"
    lookup_fields_map:
      id: "modification_type_id"
      label: "modification_type_name"
      description: "modification_type_description"
    entity_type_description: "modification type"
    roles: 
      - role: system
        content: You are archaeological specialist with expertise in identifying and classifying archaeological samples based on their features and characteristics.
    context: |
      You are provided with known modification types, each with an id, a label and a description.
    output:
      format: json
  geonames:
    geonames:
      options:
        username: "${GEONAMES_USERNAME}"
        lang: "en"
        country_bias: "en"
        fuzzy: 0.8
        feature_classes: ["P", "A"]  # Populated places and Administrative divisions
        orderby: "relevance"
        style: "FULL"

features:
  use_mcp_server: false  # Start disabled, flip to true when ready

identity:
  policy_file: "config/identity_policy.yml"
  well_known_scopes:
    - name: "sead://reconciliation"
      description: "Default scope for OpenRefine reconciliation submissions"
    - name: "sead://internal"
      description: "Internal SEAD system identity scope"
  contract_registration:
    # Test allowlist: the token is read from the environment, so unit tests
    # inject ContractRegistrationPolicy directly instead of relying on this.
    callers:
      - name: "shape-shifter"
        token: "${SIMS_CONTRACT_REGISTRATION_TOKEN}"
        scope_prefixes:
          - "provider://"

mcp:
  version: "0.1.0"
  retrieval:
    k_fuzzy: 30        # Top-K from trigram search
    k_sem: 30          # Top-K from semantic search (Phase 3)
    k_final: 20        # Final candidate count
    min_score_threshold: 0.6  # Minimum score to return
  enable_caching: true
  cache_ttl_seconds: 86400
  embedding:
    model: "sentence-transformers/all-mpnet-base-v2"
    dimensions: 768

table_specs:
  bibliographic_reference:
    name: "Bibliographic Reference"
    table_name: "tbl_biblio"
    id_column: "biblio_id"
    label_column: "full_reference"
    description_column: "title"
    alternate_identity_column: "doi"
    materialized: false
    extra_columns:
      - "t.bugs_reference"
      - "t.isbn"
      - "t.notes"
      - "t.year"
      - "t.authors"
      - "t.url"
      - "authority.immutable_unaccent(lower(t.bugs_reference)) as norm_bugs_reference"
      - "authority.immutable_unaccent(lower(t.title)) as norm_title"
      - "authority.immutable_unaccent(lower(t.authors)) as norm_authors"
    embedding_config:
      dimension: 768
      ivfflat_lists: 100
      analyze: false
  data_type:
    name: "Data Type"
    table_name: "tbl_data_types"
    id_column: "data_type_id"
    label_column: "data_type_name"
    description_column: "definition"
    alternate_identity_column: null
    reconciliation: simple
    scope_columns:
      - "data_type_group_id"
    type_or_grouping:
      foreign_table: "data_type_group"
      foreign_key_column: "data_type_group_id"
    materialized: false
    extra_columns:
      - "dtg.data_type_group_name as data_type_group_name"
      - "dtg.description as data_type_group_description"
    joins:
      - "left join public.tbl_data_type_groups dtg using (data_type_group_id)"
    details_columns:
      - 'data_type_group_name as "Group"'
      - 'data_type_group_description as "Group Description"'
    embedding_config:
      dimension: 768
      ivfflat_lists: 100
      analyze: false
  data_type_group:
    name: "Data Type Group"
    table_name: "tbl_data_type_groups"
    id_column: "data_type_group_id"
    label_column: "data_type_group_name"
