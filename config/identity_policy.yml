# SIMS Identity Policy Configuration
#
# Controls per-entity-type identity behaviour. Loaded once at startup by
# src.identity.policy.IdentityPolicy.
#
# Fields per entity:
#   entity_subtype:    provider_owned | shared_metadata | relationship
#   accept_uuid:       true  → accept caller-supplied UUID (FR-11)
#                      false → always allocate a fresh UUID; caller UUID is ignored
#   allow_allocation:  true  → service may mint a new TrackedIdentity when no match is found
#   auto_confirm:      true  → Binding Sets are auto-confirmed without manual review
#
# Notes:
#   - entity_subtype describes ownership; allow_allocation and auto_confirm
#     are separate policy settings.
#   - Entity names match tbl_* suffixes in the SEAD standard model.

entities:

  # ── Provider-owned (aggregate roots) ──────────────────────────────────────

  sample_group:
    entity_subtype: provider_owned
    accept_uuid: false
    allow_allocation: true
    auto_confirm: true

  sample:
    entity_subtype: provider_owned
    accept_uuid: false
    allow_allocation: true
    auto_confirm: true
    # Allocation fails unless the sample ID allocator has been initialized from existing IDs.

  analysis_entity:
    entity_subtype: provider_owned
    accept_uuid: false
    allow_allocation: true
    auto_confirm: true
    # Allocation fails unless the analysis_entity ID allocator has been initialized from existing IDs.

  dataset:
    entity_subtype: provider_owned
    accept_uuid: false
    allow_allocation: true
    auto_confirm: true
    # Allocation fails unless the dataset ID allocator has been initialized from existing IDs.

  submission:
    entity_subtype: provider_owned
    accept_uuid: false
    allow_allocation: true
    auto_confirm: true
    # Allocation fails unless the submission ID allocator has been initialized from existing IDs.

  # ── Shared metadata (reconciled by business key) ──────────────────────────

  site:
    entity_subtype: shared_metadata
    accept_uuid: false
    allow_allocation: true
    auto_confirm: true
    # Proposed operation allowlist; not parsed or enforced by SIMS yet:
    # operations:
    #   bind_existing: true  # Shape Shifter supplies an approved site_id.
    #   allocate_new: true   # Shape Shifter approves a miss; SIMS assigns site_id.
    # Replace allow_allocation with this mapping when operation checks are implemented.

  taxa_tree_master:
    entity_subtype: shared_metadata
    accept_uuid: true
    allow_allocation: false
    auto_confirm: false

  feature_type:
    entity_subtype: shared_metadata
    accept_uuid: true
    allow_allocation: false
    auto_confirm: false

  method:
    entity_subtype: shared_metadata
    accept_uuid: true
    allow_allocation: false
    auto_confirm: false

  data_type:
    entity_subtype: shared_metadata
    accept_uuid: true
    allow_allocation: false
    auto_confirm: false

  unit:
    entity_subtype: shared_metadata
    accept_uuid: true
    allow_allocation: false
    auto_confirm: false

  # ── Relationship / child entities (identity derived from parent) ──────────
  # Phase 2+: identity comes from FK, not from UUID allocation.

  sample_dimension:
    entity_subtype: relationship
    accept_uuid: false
    allow_allocation: false
    auto_confirm: false

  abundance:
    entity_subtype: relationship
    accept_uuid: false
    allow_allocation: false
    auto_confirm: false

# ── Global defaults ──────────────────────────────────────────────────────────
# Applied when an entity_type is not listed above.

defaults:
  entity_subtype: shared_metadata
  accept_uuid: true
  allow_allocation: false
  auto_confirm: false
