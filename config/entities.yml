bibliographic_reference:
  name: "Bibliographic Reference"
  table_name: "tbl_biblio"
  id_column: "biblio_id"
  label_column: "full_reference"
  description_column: "title"
  alternate_identity_column: "doi"
  materialized: false
  extra_columns:
    - "t.bugs_reference"
    - "t.isbn"
    - "t.notes"
    - "t.year"
    - "t.authors"
    - "t.url"
    - "authority.immutable_unaccent(lower(t.bugs_reference)) as norm_bugs_reference"
    - "authority.immutable_unaccent(lower(t.title)) as norm_title"
    - "authority.immutable_unaccent(lower(t.authors)) as norm_authors"
  embedding_config:
    dimension: 768
    ivfflat_lists: 100
    analyze: false
