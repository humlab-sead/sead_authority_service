location:
  name: "Location"
  table_name: "tbl_locations"
  id_column: "location_id"
  label_column: "location_name"
  description_column: null
  alternate_identity_column: null
  type_or_grouping:
    foreign_table: "location_type"
    foreign_key_column: "location_type_id"
  materialized: false
  extra_columns:
    - "t.default_lat_dd as latitude"
    - "t.default_long_dd as longitude"
    - "t.location_type_id"
    - "lt.location_type"
    - "st_setsrid(st_makepoint(t.default_long_dd, t.default_lat_dd), 4326) as geom"
  joins:
    - "join public.tbl_location_types lt using (location_type_id)"
  filter_params:
    - name: "location_type_ids"
      type: "integer[]"
      default: "null"
      description: "Filter by location type IDs"
      cte_definition: |
        select location_type_id
        from tbl_location_types
        where array_length(location_type_ids, 1) is null
           or location_type_id = ANY(location_type_ids)
      join_clause: "join filter_params using (location_type_id)"
      where_clause: ""
  embedding_config:
    dimension: 768
    ivfflat_lists: 100
    analyze: false  
