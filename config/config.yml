  database:
    dbname: "${SEAD_AUTHORITY_OPTIONS_DATABASE_DBNAME}"
    host: "${SEAD_AUTHORITY_OPTIONS_DATABASE_HOST}"
    port: "${SEAD_AUTHORITY_OPTIONS_DATABASE_PORT}"
    user: "${SEAD_AUTHORITY_OPTIONS_DATABASE_USER}"
    pool_min_size: 2
    pool_max_size: 10
    pool_timeout: 30.0

policy:
  site:
    proximity_boost:
      very_near_distance_km: 0.2
      to_far_distance_km: 10.0
    place_name_similarity_boost:
      similarity_threshold: 0.3
      max_boost: 0.1
  modification_type:
    lookup_format: "json"
    lookup_fields_map:
      id: "modification_type_id"
      label: "modification_type_name"
      description: "modification_type_description"
    entity_type_description: "modification type"
    roles:
      - role: system
        content: You are archaeological specialist with expertise in identifying and classifying archaeological samples based on their features and characteristics.
    context: |
      You are provided with known modification types, each with an id, a label and a description.
    output:
      format: json
  geonames:
    geonames:
      options:
        username: "${GEONAMES_USERNAME}"
        lang: "en"
        country_bias: "en"
        fuzzy: 0.8
        feature_classes: ["P", "A"]
        orderby: "relevance"
        style: "FULL"

features:
  use_mcp_server: false  # Start disabled, flip to true when ready

identity:
  # Path inside the container, resolved from the application root. The file is
  # part of the mounted config/ directory.
  policy_file: "config/identity_policy.yml"

mcp:
  version: "0.1.0"
  retrieval:
    k_fuzzy: 30        # Top-K from trigram search
    k_sem: 30          # Top-K from semantic search (Phase 3)
    k_final: 20        # Final candidate count
    min_score_threshold: 0.6  # Minimum score to return
  enable_caching: true
  cache_ttl_seconds: 86400
  embedding:
    model: "sentence-transformers/all-mpnet-base-v2"
    dimensions: 768

table_specs: "@include: entities.yml"

llm:
  provider: "${LLM_PROVIDER}"
  options:
    max_tokens: 10000
    temperature: 0.1
  enable_translation: true
  enable_semantic_matching: true
  translation_target_lang: "en"
  semantic_batch_size: 50
  openai:
    model: "${OPENAI_MODEL}"
    provider_id: "openapi"
    base_url: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    options:
      temperature: 0.1
      max_tokens: 4096
      stream: false
  ollama:
    provider_id: "ollama"
    model: "${OLLAMA_MODEL}"
    host: "${OLLAMA_BASE_URL}"
    timeout: 30
    options:
      temperature: 0.1
      num_predict: 4096
  anthropic:
    provider_id: "anthropic"
    model: "${ANTHROPIC_MODEL}"
    api_key: "${ANTHROPIC_API_KEY}"
    options:
      temperature: 0.1
      max_tokens: 1000
  prompts: "@include: prompts.yml"

geonames:
  options:
    username: "${GEONAMES_USERNAME}"
    lang: "en"
    country_bias: "en"
    fuzzy: 0.8
    feature_classes: ["P", "A"]
    orderby: "relevance"
    style: "FULL"

logging:
  folder: ./logs
  handlers:
    - sink: "sys.stdout"
      level: "INFO"
      format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <level>{message}</level>"
      backtrace: true
      diagnose: true
    - sink: "sead_authority.log"
      level: "DEBUG"
      format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} - {message}"
      rotation: "10 MB"
      retention: "30 days"
      compression: "zip"
      backtrace: true
      diagnose: true

