# Runtime settings for SEAD Authority Service
# ConfigFactory resolves ${NAME} placeholders from environment variables.

options:
  id_base: "https://w3id.org/sead/id/"
  auto_accept_threshold: 0.90
  default_query_limit: 10
  reconciliation:
    label_threshold: 0.30
    description_threshold: 0.50
  # Record selection (browse, details, interactive search, verification). Every
  # entity marked `reconciliation: simple` in entities.yml is listed here and
  # every capability is off, so the section is an explicit inventory rather than
  # an enablement. Enable one type and one capability at a time, and only after
  # the rollout checks in docs/OPERATIONS.md pass for that type.
  record_selection:
    version: 1
    browse_max_rows: 500
    browse_max_bytes: 1048576
    interactive_search_max_results: 50
    types:
      abundance_element:
        search_supported: true
        identifier_search_supported: true
        browse_supported: true
        details_supported: true
        export_verification_supported: true
